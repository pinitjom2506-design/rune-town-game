
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rune Town RPG</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#172332;color:white;font-family:Tahoma,Arial}
header{padding:12px;background:#263b58;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
button{background:#e6c47c;border:2px solid #7b562a;border-radius:7px;padding:9px;cursor:pointer;font-weight:bold}
#game{position:relative;margin:auto;max-width:960px}
canvas{width:100%;display:block;touch-action:none;background:#83b970;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;top:10px;left:10px;background:#142338d9;padding:12px;border-radius:9px;font-size:13px}
.bar{width:150px;height:12px;background:#555;margin:5px 0;border-radius:8px;overflow:hidden}
#hp,#exp{height:100%;background:#e94f60;width:100%}
#exp{background:#55bafa}
#msg{position:absolute;bottom:12px;left:10px;right:10px;background:#142338df;padding:12px;border-radius:8px;pointer-events:none}
#controls{position:absolute;inset:0;pointer-events:none;z-index:5}
#controls button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;background:#e6c47cdd;border:2px solid #7b562a;min-width:44px;min-height:42px;padding:5px;font-size:15px}
#dpad{position:absolute;bottom:64px;left:12px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,44px);gap:3px}
#dpad [data-key="ArrowUp"]{grid-column:2;grid-row:1}
#dpad [data-key="ArrowLeft"]{grid-column:1;grid-row:2}
#dpad [data-key="ArrowDown"]{grid-column:2;grid-row:2}
#dpad [data-key="ArrowRight"]{grid-column:3;grid-row:2}
#actions{position:absolute;right:12px;bottom:76px;display:flex;gap:6px;align-items:end}
#saveBtn{position:absolute;top:10px;right:10px}
#msg{bottom:5px;left:165px;right:165px;padding:7px;font-size:12px;min-height:37px}
@media(max-width:600px){#controls button{min-width:34px;min-height:33px;padding:3px;font-size:12px}#dpad{left:5px;bottom:42px;grid-template-columns:repeat(3,35px);grid-template-rows:repeat(2,34px);gap:2px}#actions{right:5px;bottom:47px;gap:3px}#hud{top:5px;left:5px;padding:5px;font-size:10px}.bar{width:100px;height:8px}#saveBtn{top:5px;right:5px}#msg{left:116px;right:111px;bottom:3px;font-size:9px;padding:3px;min-height:24px}}

#shop{position:absolute;inset:0;background:#081522c9;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#shop.open{display:flex}
#shopPanel{background:#26374b;border:3px solid #e6c47c;border-radius:12px;padding:20px;max-width:430px;width:100%;box-shadow:0 12px 40px #0009}
.shopItem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #6a7584}
.shopItem button{white-space:nowrap}
#shopNotice{min-height:22px;color:#ffdd8c}

</style>
</head>
<body>
<header>
<strong>⚔️ RUNE TOWN — PIXEL ART v18</strong>
<span id="stats">Lv.1 | Zeny 100</span>
</header>
<div id="game">
<canvas id="c" width="960" height="600"></canvas>
<div id="hud">
<strong>Novice</strong>
<div>HP <span id="hpt">100/100</span></div>
<div class="bar"><div id="hp"></div></div>
<div>EXP</div>
<div class="bar"><div id="exp"></div></div>
<div id="quest">เควส: กำจัด Poring 0/5</div>
</div>
<div id="shop"><div id="shopPanel"><h2>⚔ ร้านขายอาวุธ</h2><p id="shopBalance"></p><div class="shopItem"><span>🗡️ ดาบทอง<br><small>1,500 Zeny · ระยะโจมตี 105</small></span><button onclick="buySword('gold')">ซื้อ / สวมใส่</button></div><div class="shopItem"><span>💎 ดาบเพชร<br><small>5,000 Zeny · ระยะโจมตี 145</small></span><button onclick="buySword('diamond')">ซื้อ / สวมใส่</button></div><p id="shopNotice"></p><button onclick="closeShop()">ปิดร้านค้า ✕</button></div></div>
<div id="msg">ยินดีต้อนรับสู่ Rune Town! ใช้ WASD หรือปุ่มลูกศรเดิน</div>
<div id="controls">
<button id="saveBtn" onclick="save()">💾 บันทึก</button>
<div id="dpad">
<button data-key="ArrowUp">▲</button>
<button data-key="ArrowLeft">◀</button>
<button data-key="ArrowDown">▼</button>
<button data-key="ArrowRight">▶</button>
</div>
<div id="actions"><button onclick="attack()">⚔ โจมตี</button><button onclick="interact()">💬 คุย</button></div>
</div>
</div>
<script>
const canvas=document.getElementById('c'),g=canvas.getContext('2d');
g.imageSmoothingEnabled=false;

const $=id=>document.getElementById(id);
let p={x:480,y:340,hp:100,max:100,lv:1,exp:0,zeny:100,kills:0,dir:0,weapon:'normal',owned:['normal']};
try{Object.assign(p,JSON.parse(localStorage.getItem('rune-save'))||{})}catch(e){}
p.lv=Math.min(550,Math.max(1,Math.floor(Number(p.lv)||1)));
if(p.lv===550)p.exp=0;
if(!Array.isArray(p.owned))p.owned=['normal'];
if(!['normal','gold','diamond'].includes(p.weapon))p.weapon='normal';
let keys={},tick=0,hit=0,invulnerable=0,dead=false,slash=null,facing={x:1,y:0},damageTexts=[];
let npcs=[
{x:265,y:230,name:'Kafra',color:'#f6d6a0'},
{x:695,y:250,name:'ร้านค้า',color:'#d8aaff'},
{x:475,y:175,name:'รับเควส',color:'#92e7ff'}
];
let mobs=Array.from({length:5},(_,i)=>({
x:110+(i*113)%740,y:380+(i*71)%150,
alive:true,hp:100,maxHp:100,respawn:0,cooldown:Math.floor(Math.random()*90),vx:0,vy:0
}));
function say(t){$('msg').textContent=t}
function save(){localStorage.setItem('rune-save',JSON.stringify(p));say('บันทึกเกมแล้ว!')}
const MAX_LEVEL=550;
function expRequired(level){return level>=MAX_LEVEL?0:50*Math.pow(2,level-1)}
function levelExpMultiplier(){return Math.pow(1.25,p.lv-1)}
function levelDamageMultiplier(){return Math.pow(1.5,p.lv-1)}
function updateHUD(){
$('stats').textContent=`Lv.${p.lv} | Zeny ${p.zeny} | ดาบ${p.weapon==='diamond'?'เพชร':p.weapon==='gold'?'ทอง':'ธรรมดา'}`;
$('hpt').textContent=`${p.hp}/${p.max}`;
$('hp').style.width=(p.hp/p.max*100)+'%';
$('exp').style.width=((p.lv>=MAX_LEVEL?100:p.exp/expRequired(p.lv)*100))+'%';
$('quest').textContent=`เควส: กำจัด Poring ${Math.min(5,p.kills)}/5`;
}
function revive(){p.hp=p.max;p.x=480;p.y=340;dead=false;invulnerable=120;say('ฟื้นคืนชีพแล้ว! ได้รับการคุ้มครองชั่วคราว');updateHUD()}
function near(a,b,d=65){return Math.hypot(a.x-b.x,a.y-b.y)<d}
const swords={gold:{name:'ดาบทอง',price:1500},diamond:{name:'ดาบเพชร',price:5000}};
function openShop(){ $('shop').classList.add('open');$('shopNotice').textContent='เลือกอาวุธที่ต้องการ';updateShop() }
function closeShop(){ $('shop').classList.remove('open') }
function updateShop(){ $('shopBalance').textContent='คุณมี '+p.zeny.toLocaleString('th-TH')+' Zeny'; }
function buySword(kind){
 const item=swords[kind];if(!item)return;
 if(!p.owned.includes(kind)){
  if(p.zeny<item.price){$('shopNotice').textContent='Zeny ไม่เพียงพอ ต้องใช้ '+item.price.toLocaleString('th-TH')+' Zeny';return}
  p.zeny-=item.price;p.owned.push(kind);
 }
 p.weapon=kind;updateHUD();updateShop();
 $('shopNotice').textContent='สวมใส่'+item.name+'แล้ว!';
 saveSilent();
}
function saveSilent(){localStorage.setItem('rune-save',JSON.stringify(p))}
function interact(){
if(dead){revive();return}
let n=npcs.find(n=>near(p,n,75));
if(!n){say('เดินเข้าใกล้ NPC แล้วกดคุย');return}
if(n.name==='Kafra'){
p.hp=p.max;say('Kafra: ฟื้นฟู HP ให้แล้วค่ะ!')
}else if(n.name==='ร้านค้า'){
openShop();say('ร้านค้า: เลือกซื้อดาบทองหรือดาบเพชร')
}else{
if(p.kills>=5){const questExp=Math.round(500*(p.weapon==='diamond'?4:p.weapon==='gold'?2:1)*levelExpMultiplier());p.zeny+=200;p.kills=0;if(p.lv<MAX_LEVEL)p.exp+=questExp;while(p.lv<MAX_LEVEL&&p.exp>=expRequired(p.lv)){p.exp-=expRequired(p.lv);p.lv++;p.max+=20;p.hp=p.max;say('LEVEL UP! เลเวล '+p.lv)}if(p.lv>=MAX_LEVEL){p.lv=MAX_LEVEL;p.exp=0}say('เควสสำเร็จ! รับ 200 Zeny และ '+(p.lv>=MAX_LEVEL?0:questExp)+' EXP')}
else say('กำจัด Poring ให้ครบ 5 ตัวแล้วกลับมาหาฉัน')
}
updateHUD()
}
function attack(){
if(dead){say('คุณหมดสติ! กดคุยเพื่อฟื้นคืนชีพ');return}
hit=20;
slash={x:p.x,y:p.y-30,dx:facing.x,dy:facing.y,life:20};
let range=p.weapon==='diamond'?145:p.weapon==='gold'?105:75;
let m=mobs.find(m=>m.alive&&near(p,m,range));
if(!m){say('ไม่มีมอนสเตอร์อยู่ใกล้');return}
const damage=Math.round((p.weapon==='diamond'?65:p.weapon==='gold'?40:20)*levelDamageMultiplier());
m.hp=Math.max(0,m.hp-damage);
damageTexts.push({x:m.x,y:m.y-48,value:damage,life:48});
if(m.hp>0){say('โจมตี Poring! สร้างความเสียหาย '+damage);return}
m.alive=false;m.respawn=240;
const expGain=Math.round((p.weapon==='diamond'?80:p.weapon==='gold'?40:20)*levelExpMultiplier());
if(p.lv<MAX_LEVEL)p.exp+=expGain;p.zeny+=10;p.kills++;
say('กำจัด Poring! '+damage+' DMG, +'+(p.lv>=MAX_LEVEL?0:expGain)+' EXP, +10 Zeny');
while(p.lv<MAX_LEVEL&&p.exp>=expRequired(p.lv)){
p.exp-=expRequired(p.lv);p.lv++;p.max+=20;p.hp=p.max;
say('LEVEL UP! เลเวล '+p.lv)
}
if(p.lv>=MAX_LEVEL){p.lv=MAX_LEVEL;p.exp=0;}
updateHUD()
}
document.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
if(e.key===' ')attack();
if(e.key.toLowerCase()==='e')interact()
});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-key]').forEach(b=>{
let k=b.dataset.key.toLowerCase();
b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};
b.onpointerup=b.onpointercancel=()=>keys[k]=false
});
function ellipse(x,y,rx,ry,c){
// Deliberately stepped pixel ellipse, not a smooth vector shape.
g.fillStyle=c;
for(let yy=-ry;yy<=ry;yy+=4){let t=yy/ry;let w=Math.floor(rx*Math.sqrt(Math.max(0,1-t*t))/3)*3;g.fillRect(Math.round(x-w),Math.round(y+yy),w*2,4)}
}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(t,x,y,color='#fff',size=15){
g.font=`bold ${size}px monospace`;g.textAlign='center';
g.lineWidth=3;g.strokeStyle='#34333c';g.strokeText(t,x,y);
g.fillStyle=color;g.fillText(t,x,y)
}
// Pixel Art v3: native 24x32 hand-drawn sprite, no image download required.
const knightRows=[
'...........KKKK.........',
'.........KKLLLLKK.......',
'........KLLHHHHLLK......',
'........KLHHHHHHLK......',
'.......KLLHHHHHHLLK.....',
'.......KLLHHHHHHLLK.....',
'.......KLLDDDDDDLLK.....',
'.......KLLDOOODDLLK.....',
'........KLDDOODDLK......',
'........KKLDDDD LKK.....',
'.....KKKRRRRRRRRKKK.....',
'....KLLLRRRRRRRRLLLK....',
'...KLLLLRRRRRRRRLLLLK...',
'..KLLLLLSSSSSSSSLLLLLK..',
'..KLLHHHSSHHHHSSHHHLLK..',
'..KLLHHHSSHHHHSSHHHLLK..',
'...KLLHHSSHHHHSSHHLLK...',
'....KLLHSSHHHHSSHLLK....',
'.....KLLSSHHHHSSLLK.....',
'.....KKLSSBBBBSSLKK.....',
'......KLSSBBBBSSLK......',
'......KLLSSSSSSLLK......',
'.......KLHHHHHHLK.......',
'.......KLHHHHHHLK.......',
'......KLLHHKKHHLLK......',
'......KLLHHKKHHLLK......',
'......KLLHHKKHHLLK......',
'......KLLHHKKHHLLK......',
'......KLLHHKKHHLLK......',
'.....KLLLHHKKHHLLLK.....',
'.....KLLLLKKKKLLLLK.....',
'.....KKKKKK..KKKKKK.....'
];
const knightPalette={K:'#17202b',L:'#425566',H:'#91a9b6',D:'#29323d',O:'#f1ad53',R:'#bd2635',S:'#5c7180',B:'#a57b4b'};
function character(x,y,color,player=false){
 if(!player){
  ellipse(x,y+7,19,7,'#0005');
  rect(x-10,y-28,20,27,color);
  rect(x-9,y-3,7,12,'#59433d');rect(x+2,y-3,7,12,'#59433d');
  ellipse(x,y-40,14,16,'#f6c49e');
  ellipse(x,y-52,15,8,'#795448');return;
 }
 const moving=!dead&&(keys['w']||keys['a']||keys['s']||keys['d']||keys['arrowup']||keys['arrowdown']||keys['arrowleft']||keys['arrowright']);
 const bob=moving?Math.round(Math.sin(tick/5)*2):0;
 const px=Math.round(x-36),py=Math.round(y-96+bob),sz=3;
 ellipse(x,y+8,25,7,'#0006');
 // Wind-blown red cape, each block aligned to the pixel grid.
 for(let j=0;j<13;j++)rect(px+57+j*2,py+37+j*3,15,6,j%3?'#92192b':'#cf3444');
 knightRows.forEach((line,j)=>{for(let i=0;i<24;i++){const c=knightPalette[line[i]];if(c)rect(px+i*sz,py+j*sz,sz,sz,c)}});
 // Raised sword with sharp stepped silhouette.
 const swordX=px-8+(hit>0?6:0);
 const blade=p.weapon==='diamond'?'#54f1ff':p.weapon==='gold'?'#ffd44b':'#d7ebf5';
 rect(swordX,py+9,6,48,'#263341');rect(swordX+2,py+6,3,40,blade);
 rect(swordX+1,py+3,4,7,blade);rect(swordX-6,py+48,17,5,'#d5b36b');
 rect(swordX+1,py+53,5,15,'#614536');
 // Lion shield at right
 rect(px+54,py+41,21,38,'#1b2532');
 rect(px+57,py+44,15,30,'#718b9c');
 rect(px+60,py+49,9,5,'#d5d8c5');
 rect(px+63,py+54,6,13,'#d5d8c5');
 rect(px+60,py+62,3,7,'#d5d8c5');
 text('YOU',x,y-105+bob,'#ffe77e',12);
}

function drawNPC(n){
 const x=n.x,y=n.y;
 const unit=3, ox=Math.round(x-36),oy=Math.round(y-94);
 const px=(a,b,w,h,c)=>rect(ox+a*unit,oy+b*unit,w*unit,h*unit,c);
 ellipse(x,y+7,23,7,'#0005');
 if(n.name==='Kafra'){
  // Royal guardian: white/silver plate, royal-blue cape, gold trim and winged helm.
  // Separate silhouette and palette from the player's dark armor and red cape.
  px(3,14,8,14,'#173d87');px(1,20,7,10,'#245fc1');px(23,14,8,14,'#173d87');px(26,21,6,9,'#245fc1');
  px(9,26,6,6,'#263f62');px(19,26,6,6,'#263f62');
  px(8,29,8,3,'#b4cce3');px(18,29,8,3,'#b4cce3');
  px(9,13,17,14,'#283f63');px(11,14,13,12,'#d5e5f2');
  px(13,16,9,7,'#88aac8');px(15,16,5,5,'#eef9ff');
  px(7,13,6,7,'#a7c7e1');px(23,13,6,7,'#a7c7e1');
  px(6,15,5,4,'#e4f4ff');px(25,15,5,4,'#e4f4ff');
  px(12,23,13,3,'#b18a44');px(17,23,4,4,'#fff0aa');
  px(10,3,16,12,'#344d73');px(12,1,12,12,'#c2d8e8');
  px(14,2,8,4,'#f4fbff');px(13,7,12,3,'#21334f');
  px(16,9,6,5,'#779ab5');px(18,10,2,5,'#e6f2ff');
  // Distinct gold crown crest and silver helmet wings.
  px(17,0,4,5,'#e7bd59');px(18,0,2,3,'#fff0a0');
  px(7,3,6,3,'#e2f1ff');px(5,1,4,3,'#9fc5e4');
  px(25,3,6,3,'#e2f1ff');px(29,1,4,3,'#9fc5e4');
  // Tall spear instead of the player's sword and shield.
  px(30,7,2,24,'#6b4c2b');px(29,2,4,7,'#d5eafa');
  px(30,0,2,4,'#f9ffff');px(28,8,6,2,'#d5b45b');
 }else if(n.name==='ร้านค้า'){
  // Hooded bearded ranger / axe merchant.
  px(7,11,16,17,'#46362f');px(4,12,5,14,'#283748');px(22,12,5,14,'#283748');
  px(8,27,6,5,'#342b2c');px(18,27,6,5,'#342b2c');
  px(8,10,16,5,'#273647');px(6,6,20,9,'#293949');
  px(9,3,14,8,'#273648');px(11,5,10,9,'#a7785d');
  px(10,7,12,3,'#1a2735');px(12,10,8,2,'#342a28');
  px(11,12,10,5,'#4b3029');px(13,11,6,3,'#291f22');
  px(10,17,12,9,'#70503b');px(13,17,3,9,'#ae8b62');
  px(6,19,4,8,'#896449');px(22,19,4,8,'#896449');
  px(15,22,4,4,'#c0a174');
  // Axe on shoulder.
  px(23,0,2,18,'#6a4a36');px(20,0,7,4,'#a6c3cc');px(19,2,10,3,'#667e91');
  px(26,3,3,4,'#cadbe0');
 }else{
  // Red-haired female archer in green cape and steel armor.
  px(5,12,22,17,'#1c493d');px(3,19,7,11,'#276c51');px(23,19,7,11,'#276c51');
  px(10,24,5,8,'#677e87');px(18,24,5,8,'#677e87');
  px(8,11,17,15,'#435664');px(12,13,10,9,'#a7b9bf');
  px(7,12,5,6,'#7b919d');px(23,12,5,6,'#7b919d');
  px(11,2,12,12,'#8f4329');px(10,4,14,9,'#b5653e');
  px(12,6,10,9,'#e5ad87');px(11,6,3,9,'#ad5b35');px(21,6,4,12,'#a95835');
  px(20,14,3,10,'#ba6e43');px(13,9,2,1,'#2b2935');px(19,9,2,1,'#2b2935');
  px(11,14,11,3,'#23573f');px(11,22,11,3,'#785338');
  // Bow and string.
  px(27,10,2,17,'#9b6a3c');px(28,8,2,4,'#b88a55');px(28,26,2,4,'#b88a55');
  px(27,11,1,16,'#e6d5a7');
 }
 text(n.name,x,y-106,'#fff1b5',15);
}
function building(x,y,w,h,roof){
rect(x,y,w,h,'#c9a980');
rect(x+12,y+23,24,34,'#5d463e');
rect(x+w-44,y+20,26,30,'#66504b');
g.fillStyle=roof;g.beginPath();
g.moveTo(x-18,y);g.lineTo(x+w/2,y-72);
g.lineTo(x+w+18,y);g.fill();
}
function draw(){
tick++;
g.imageSmoothingEnabled=false;
let dx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0);
let dy=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
if((dx||dy)&&!dead){
const mag=Math.hypot(dx,dy);facing={x:dx/mag,y:dy/mag};
let speed=2.7/Math.hypot(dx,dy);
p.x=Math.max(25,Math.min(935,p.x+dx*speed));
p.y=Math.max(175,Math.min(570,p.y+dy*speed));
}
// Poring AI: pursue nearby players, attack with a cooldown, and respawn.
if(invulnerable>0)invulnerable--;
mobs.forEach(m=>{
 if(!m.alive)return;
 if(m.cooldown>0)m.cooldown--;
 if(dead)return;
 const distance=Math.hypot(p.x-m.x,p.y-m.y);
 if(distance<180&&distance>30){
   const step=0.55;
   m.x+=((p.x-m.x)/distance)*step;
   m.y+=((p.y-m.y)/distance)*step;
 }
 if(distance<44&&m.cooldown<=0&&invulnerable<=0){
   const damage=5+Math.floor(Math.random()*7);
