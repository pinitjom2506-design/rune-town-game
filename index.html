
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rune Town RPG</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#172332;color:white;font-family:Tahoma,Arial}
header{padding:12px;background:#263b58;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
button{background:#e6c47c;border:2px solid #7b562a;border-radius:7px;padding:9px;cursor:pointer;font-weight:bold}
#game{position:relative;margin:auto;max-width:960px}
canvas{width:100%;display:block;touch-action:none;background:#83b970;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;top:10px;left:10px;background:#142338d9;padding:12px;border-radius:9px;font-size:13px}
.bar{width:150px;height:12px;background:#555;margin:5px 0;border-radius:8px;overflow:hidden}
#hp,#exp{height:100%;background:#e94f60;width:100%}
#exp{background:#55bafa}
#msg{position:absolute;bottom:12px;left:10px;right:10px;background:#142338df;padding:12px;border-radius:8px;pointer-events:none}
#controls{text-align:center;padding:12px}
#controls button{min-width:55px;margin:3px;touch-action:none}
</style>
</head>
<body>
<header>
<strong>⚔️ RUNE TOWN — Fantasy RPG</strong>
<span id="stats">Lv.1 | Zeny 100</span>
<button onclick="save()">บันทึกเกม</button>
</header>
<div id="game">
<canvas id="c" width="960" height="600"></canvas>
<div id="hud">
<strong>Novice</strong>
<div>HP <span id="hpt">100/100</span></div>
<div class="bar"><div id="hp"></div></div>
<div>EXP</div>
<div class="bar"><div id="exp"></div></div>
<div id="quest">เควส: กำจัด Poring 0/5</div>
</div>
<div id="msg">ยินดีต้อนรับสู่ Rune Town! ใช้ WASD หรือปุ่มลูกศรเดิน</div>
</div>
<div id="controls">
<div><button data-key="ArrowUp">▲</button></div>
<div>
<button data-key="ArrowLeft">◀</button>
<button data-key="ArrowDown">▼</button>
<button data-key="ArrowRight">▶</button>
<button onclick="attack()">⚔ โจมตี</button>
<button onclick="interact()">💬 คุย</button>
</div>
</div>
<script>
const canvas=document.getElementById('c'),g=canvas.getContext('2d');
g.imageSmoothingEnabled=false;

const $=id=>document.getElementById(id);
let p={x:480,y:340,hp:100,max:100,lv:1,exp:0,zeny:100,kills:0,dir:0};
try{Object.assign(p,JSON.parse(localStorage.getItem('rune-save'))||{})}catch(e){}
let keys={},tick=0,hit=0,invulnerable=0,dead=false;
let npcs=[
{x:265,y:230,name:'Kafra',color:'#f6d6a0'},
{x:695,y:250,name:'ร้านค้า',color:'#d8aaff'},
{x:475,y:175,name:'รับเควส',color:'#92e7ff'}
];
let mobs=Array.from({length:9},(_,i)=>({
x:110+(i*113)%740,y:380+(i*71)%150,
alive:true,respawn:0,cooldown:Math.floor(Math.random()*90),vx:0,vy:0
}));
function say(t){$('msg').textContent=t}
function save(){localStorage.setItem('rune-save',JSON.stringify(p));say('บันทึกเกมแล้ว!')}
function updateHUD(){
$('stats').textContent=`Lv.${p.lv} | Zeny ${p.zeny}`;
$('hpt').textContent=`${p.hp}/${p.max}`;
$('hp').style.width=(p.hp/p.max*100)+'%';
$('exp').style.width=(p.exp/(p.lv*50)*100)+'%';
$('quest').textContent=`เควส: กำจัด Poring ${Math.min(5,p.kills)}/5`;
}
function revive(){p.hp=p.max;p.x=480;p.y=340;dead=false;invulnerable=120;say('ฟื้นคืนชีพแล้ว! ได้รับการคุ้มครองชั่วคราว');updateHUD()}
function near(a,b,d=65){return Math.hypot(a.x-b.x,a.y-b.y)<d}
function interact(){
if(dead){revive();return}
let n=npcs.find(n=>near(p,n,75));
if(!n){say('เดินเข้าใกล้ NPC แล้วกดคุย');return}
if(n.name==='Kafra'){
p.hp=p.max;say('Kafra: ฟื้นฟู HP ให้แล้วค่ะ!')
}else if(n.name==='ร้านค้า'){
if(p.zeny>=20){p.zeny-=20;p.hp=Math.min(p.max,p.hp+40);say('ซื้อ Potion 20 Zeny ฟื้นฟู HP +40')}
else say('Zeny ไม่เพียงพอ')
}else{
if(p.kills>=5){p.zeny+=200;p.kills=0;say('เควสสำเร็จ! รับ 200 Zeny')}
else say('กำจัด Poring ให้ครบ 5 ตัวแล้วกลับมาหาฉัน')
}
updateHUD()
}
function attack(){
if(dead){say('คุณหมดสติ! กดคุยเพื่อฟื้นคืนชีพ');return}
hit=12;
let m=mobs.find(m=>m.alive&&near(p,m,75));
if(!m){say('ไม่มีมอนสเตอร์อยู่ใกล้');return}
m.alive=false;m.respawn=240;
p.exp+=20;p.zeny+=10;p.kills++;
say('กำจัด Poring! +20 EXP, +10 Zeny');
if(p.exp>=p.lv*50){
p.exp-=p.lv*50;p.lv++;p.max+=20;p.hp=p.max;
say('LEVEL UP! เลเวล '+p.lv)
}
updateHUD()
}
document.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
if(e.key===' ')attack();
if(e.key.toLowerCase()==='e')interact()
});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-key]').forEach(b=>{
let k=b.dataset.key.toLowerCase();
b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};
b.onpointerup=b.onpointercancel=()=>keys[k]=false
});
function ellipse(x,y,rx,ry,c){
// Deliberately stepped pixel ellipse, not a smooth vector shape.
g.fillStyle=c;
for(let yy=-ry;yy<=ry;yy+=4){let t=yy/ry;let w=Math.floor(rx*Math.sqrt(Math.max(0,1-t*t))/3)*3;g.fillRect(Math.round(x-w),Math.round(y+yy),w*2,4)}
}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(t,x,y,color='#fff',size=15){
g.font=`bold ${size}px monospace`;g.textAlign='center';
g.lineWidth=3;g.strokeStyle='#34333c';g.strokeText(t,x,y);
g.fillStyle=color;g.fillText(t,x,y)
}
const knightSprite=new Image();knightSprite.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAABICAYAAACwc3YrAAADaUlEQVR42mNgGAWjYBQMacBILYPy26f/J0X9xMpMqtjNNNRjgIUSzaLKRv+poff13XOMIzYGGCmNgbaeDoocUFVSMbJjACUPfPzx/z8DAwMDPwcj3hBxjsz8Ty0H6JmZMzCYmf9nYGBg2Lt8OuOIi4Hh44Gdpy//x8YejQF6ZuITl6+M5oFRD9CzLXT28EGGs4cPUsUhxrb2ozFAMbjZa0CSevXiC6N5gKoxQI0QHVAPwEBibj5OufmTJw5+D8BAoLs1nL1+59HBFwPkFH3kFpejmRgZ7F0+nXGprNH/AjYcnRQD3MXppVMnMcQo6VIy4mpCu5vqMvYsWoe1WW3b3EuT0DxcW4xTriQuiHG0MTdk84C5oRZdHIPNnpPnr9G+Hrjy/SvJenQ4uQeuFPq1bi5KCAlWNZFsxswwPwYtdVWKY3jA80BrVS1tYmCprNH/5xQYrMDJilPuwfffKHw/z2A4e9P2tdRPQoQyEjUBsmcYGBgYqtuayavI3gTFM8w2MyRooZKGGpytr41g69S34c70jVUMF6/egjTyFi5iYGBgYIhOS2NYOmsWXrveP7nKSNfWKKkgOi0NkYSxeEZQRvs/uocGlQdI8cygjAFyPDPaJ0YGsIzJwMDAoEOkOnIBLEMPyiSUGhWIwp+9bD3+GLi+Mfs/w7MZKBJyUywZpiPxMxf9oLpDYUXogCah74dWYhWfI8HA0FZhjSFe1XGUgQGHnmHRH0BPPshi2IpTjBio6T4GZ7eUWsHZU2/chYgJfRp8pZCm/1RGWAOOQR4h+a/q6miXklQwe9l6jFKHYClECjj4ipkiB1KqH71RR7IHur/9ZWBgYGBokhAiqPZYBmI4Eaael48fUYJ9/Ua9JLRUlvDKkwufaJeBCTWlKUpCtHQ4uidgDTf0dI/Lg0wD6XgxSUmKYwIjBoIeMjIY8PExXPj0ieECA+1DXkxSkuHV8+dEJy/0XhnTQCYZXDFBSiwQTELRj88xDqQn8IU+PAlhK4Ho5XBykw7OPEBNhyObpS7hQrCYnsLIzpDz/ydJdsDbQPgcjhxDu8P9SbJgQU89Y0JJI0nLdzauWEVwOAUlDxAKdXonJ/+IsKHbmEMPdXyhP+hHJQg5nqzG3IEdOxjooWfIJyGaeGAw1A1ke2AwOn5YJKFRMNAAAGmLML+7T97HAAAAAElFTkSuQmCC';
function character(x,y,color,player=false){
 if(!player){
  ellipse(x,y+7,19,7,'#0005');
  rect(x-10,y-28,20,27,color);
  rect(x-9,y-3,7,12,'#59433d');rect(x+2,y-3,7,12,'#59433d');
  ellipse(x,y-40,14,16,'#f6c49e');
  ellipse(x,y-52,15,8,'#795448');
  return;
 }
 // Native pixel sprite, nearest-neighbor rendering (no blur).
 const moving=!dead&&(keys['w']||keys['a']||keys['s']||keys['d']||keys['arrowup']||keys['arrowdown']||keys['arrowleft']||keys['arrowright']);
 const bob=moving?Math.round(Math.sin(tick/5)*2):0;
 ellipse(x,y+7,23,7,'#0006');
 if(knightSprite.complete&&knightSprite.naturalWidth){
   g.imageSmoothingEnabled=false;
   g.drawImage(knightSprite,Math.round(x-36),Math.round(y-102+bob),72,108);
 }else{
   rect(x-15,y-65,30,55,'#536a7b');rect(x-15,y-42,30,8,'#a71f31');
 }
 text('YOU',x,y-105+bob,'#ffe77e',12);
}
function building(x,y,w,h,roof){
rect(x,y,w,h,'#c9a980');
rect(x+12,y+23,24,34,'#5d463e');
rect(x+w-44,y+20,26,30,'#66504b');
g.fillStyle=roof;g.beginPath();
g.moveTo(x-18,y);g.lineTo(x+w/2,y-72);
g.lineTo(x+w+18,y);g.fill();
}
function draw(){
tick++;
g.imageSmoothingEnabled=false;
let dx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0);
let dy=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
if((dx||dy)&&!dead){
let speed=2.7/Math.hypot(dx,dy);
p.x=Math.max(25,Math.min(935,p.x+dx*speed));
p.y=Math.max(175,Math.min(570,p.y+dy*speed));
}
// Poring AI: pursue nearby players, attack with a cooldown, and respawn.
if(invulnerable>0)invulnerable--;
mobs.forEach(m=>{
 if(!m.alive)return;
 if(m.cooldown>0)m.cooldown--;
 if(dead)return;
 const distance=Math.hypot(p.x-m.x,p.y-m.y);
 if(distance<180&&distance>30){
   const step=0.55;
   m.x+=((p.x-m.x)/distance)*step;
   m.y+=((p.y-m.y)/distance)*step;
 }
 if(distance<44&&m.cooldown<=0&&invulnerable<=0){
   const damage=5+Math.floor(Math.random()*7);
   p.hp=Math.max(0,p.hp-damage);
   m.cooldown=105;
   invulnerable=35;
   say('Poring โจมตีคุณ! -'+damage+' HP');
   if(p.hp<=0){
     dead=true;
     say('คุณหมดสติ! กดปุ่ม 💬 คุย หรือ E เพื่อฟื้นคืนชีพ');
   }
 }
});
rect(0,0,960,600,'#8fbd7a');
rect(0,145,960,455,'#d6c5a3');
for(let y=152;y<600;y+=32){
for(let x=(Math.floor(y/32)%2)*23;x<960;x+=46){
g.strokeStyle='#b8a88b';g.lineWidth=1;
g.strokeRect(x,y,45,30)
}}
rect(0,0,960,150,'#9e9b91');
for(let x=0;x<960;x+=70){
rect(x,0,58,35,'#bdb7aa');
rect(x,65,58,85,'#afa89a')
}
rect(375,45,210,140,'#5b5960');
rect(394,65,172,120,'#c7b9a1');
rect(417,90,126,95,'#534c4b');
text('RUNE TOWN',480,43,'#ffe7a1',24);
building(10,210,195,180,'#935d42');
building(755,195,195,185,'#89553c');
building(30,10,190,110,'#76503d');
building(735,15,195,110,'#76503d');
for(let i=0;i<20;i++){
let x=(i*179+31)%950,y=(i*113+210)%590;
if(x>240&&x<710&&y>230)continue;
ellipse(x,y,28,18,'#4f9150');
ellipse(x-8,y-8,23,17,'#69a85b')
}
ellipse(600,425,88,48,'#999d94');
ellipse(600,418,73,38,'#65c5e4');
ellipse(600,418,48,24,'#b1e9f1');
rect(593,350,14,65,'#c8c7c0');
ellipse(600,345,20,16,'#e2dfd3');
text('น้ำพุเมือง',600,485,'#fff',13);
npcs.forEach(n=>{
character(n.x,n.y,n.color);
text(n.name,n.x,n.y-70,'#fff1b5',15)
});
mobs.forEach(m=>{
if(!m.alive){
if(--m.respawn<=0)m.alive=true;
return
}
let bounce=Math.sin(tick/12+m.x)*3;
ellipse(m.x,m.y+6,18,6,'#0003');
ellipse(m.x,m.y-9+bounce,19,15,'#f49db7');
ellipse(m.x-7,m.y-13+bounce,3,4,'#393445');
ellipse(m.x+7,m.y-13+bounce,3,4,'#393445');
text('Poring',m.x,m.y-32+bounce,'#ffe2ed',12)
});
if(invulnerable===0||tick%10<5)character(p.x,p.y,dead?'#666666':'#b96650',true);
if(dead){rect(260,260,440,76,'#15151ddd');text('คุณหมดสติ!',480,291,'#ff7788',28);text('กด คุย หรือ E เพื่อฟื้นคืนชีพ',480,321,'#ffffff',17)}
if(hit>0){
hit--;g.strokeStyle='#ffe67b';g.lineWidth=5;
g.beginPath();g.arc(p.x,p.y-22,34,-1.5,1.2);g.stroke()
}
updateHUD();
requestAnimationFrame(draw)
}
draw();
</script>
</body>
</html>
